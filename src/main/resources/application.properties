spring.application.name=scheduler-service
server.port=8080

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/scheduler_db
spring.datasource.username=scheduler_user
spring.datasource.password=securepassword
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=DEBUG

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT configuration
jwt.secret=*5U!]YtC6/vJ24E=`v#&,o;Zl0ojOOBMc[&]:NJi}1F"c-;={Bf^H@Tnh(|+yGc
jwt.expiration=3600000

# Actuator
management.endpoints.web.exposure.include=health,metrics

# Scheduler configuration
# Options: catch-up, skip
scheduler.missed-execution-strategy=catch-up
scheduler.check-and-execute-rate=60000
executer.job-execution-time=5000
